
name: Bootstrap Snowflake DCM Project Structure

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch where the DCM project structure should be created"
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

      schema_name:
        description: "Snowflake business schema name (e.g., TPCH_SF1, SALES, FINANCE)"
        required: true
        type: string

      account_identifier:
        description: "Snowflake account identifier"
        required: true
        default: "YOUR_ORG-YOUR_ACCOUNT"
        type: string

      dcm_database:
        description: "Database containing Snowflake DCM projects"
        required: true
        default: "DCM_ADMIN_DB"
        type: string

      dcm_schema:
        description: "Schema containing Snowflake DCM projects"
        required: true
        default: "PROJECTS"
        type: string

permissions:
  contents: write

jobs:

  create-structure:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT SELECTED BRANCH
      # --------------------------------------------------

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.BOOTSTRAP_TOKEN }}
          fetch-depth: 0

      # --------------------------------------------------
      # 2. VALIDATE INPUTS
      # --------------------------------------------------

      - name: Validate inputs
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
          ACCOUNT_IDENTIFIER: ${{ inputs.account_identifier }}
          DCM_DATABASE: ${{ inputs.dcm_database }}
          DCM_SCHEMA: ${{ inputs.dcm_schema }}
        run: |
          set -euo pipefail

          if [[ ! "${SCHEMA_NAME}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "Invalid schema name: ${SCHEMA_NAME}"
            exit 1
          fi

          if [[ ! "${DCM_DATABASE}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "Invalid DCM database name."
            exit 1
          fi

          if [[ ! "${DCM_SCHEMA}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "Invalid DCM schema name."
            exit 1
          fi

          if [[ ! "${ACCOUNT_IDENTIFIER}" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid Snowflake account identifier."
            exit 1
          fi

          echo "All inputs validated successfully."

      # --------------------------------------------------
      # 3. CREATE DCM PROJECT STRUCTURE
      # --------------------------------------------------

      - name: Create DCM project structure
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
          ACCOUNT_IDENTIFIER: ${{ inputs.account_identifier }}
          DCM_DATABASE: ${{ inputs.dcm_database }}
          DCM_SCHEMA: ${{ inputs.dcm_schema }}
        run: |

          set -euo pipefail

          PROJECT_PREFIX="DCM_${SCHEMA_NAME}"
          PROJECT_DIR="${PROJECT_PREFIX}"

          PROJECT_OWNER="${PROJECT_PREFIX}_DEPLOYER"

          LOWER_SCHEMA=$(echo "${SCHEMA_NAME}" | tr '[:upper:]' '[:lower:]')

          echo "----------------------------------------"
          echo "Creating DCM Project"
          echo "Project       : ${PROJECT_PREFIX}"
          echo "Schema        : ${SCHEMA_NAME}"
          echo "Account       : ${ACCOUNT_IDENTIFIER}"
          echo "DCM Database  : ${DCM_DATABASE}"
          echo "DCM Schema    : ${DCM_SCHEMA}"
          echo "Project Owner : ${PROJECT_OWNER}"
          echo "----------------------------------------"

          # --------------------------------------------------
          # 3.1 CREATE OBJECT TYPE DIRECTORIES
          # --------------------------------------------------

          mkdir -p "${PROJECT_DIR}/sources/definitions/database"
          mkdir -p "${PROJECT_DIR}/sources/definitions/schemas"
          mkdir -p "${PROJECT_DIR}/sources/definitions/tables"
          mkdir -p "${PROJECT_DIR}/sources/definitions/views"
          mkdir -p "${PROJECT_DIR}/sources/definitions/procedures"
          mkdir -p "${PROJECT_DIR}/sources/definitions/functions"
          mkdir -p "${PROJECT_DIR}/sources/definitions/streams"
          mkdir -p "${PROJECT_DIR}/sources/definitions/tasks"
          mkdir -p "${PROJECT_DIR}/sources/definitions/grants"
          mkdir -p "${PROJECT_DIR}/sources/macros"

          # --------------------------------------------------
          # 3.2 GENERATE MANIFEST.YML
          # --------------------------------------------------

          if [ ! -f "${PROJECT_DIR}/manifest.yml" ]; then

            cat > "${PROJECT_DIR}/manifest.yml" <<EOF
          # Snowflake DCM Project
          # Project: ${PROJECT_PREFIX}
          # Business Schema: ${SCHEMA_NAME}

          manifest_version: 2

          type: DCM_PROJECT

          default_target: DEV

          targets:

            DEV:
              account_identifier: ${ACCOUNT_IDENTIFIER}
              project_name: ${DCM_DATABASE}.${DCM_SCHEMA}.${PROJECT_PREFIX}_DEV
              project_owner: ${PROJECT_OWNER}
              templating_config: DEV

            QA:
              account_identifier: ${ACCOUNT_IDENTIFIER}
              project_name: ${DCM_DATABASE}.${DCM_SCHEMA}.${PROJECT_PREFIX}_QA
              project_owner: ${PROJECT_OWNER}
              templating_config: QA

            UAT:
              account_identifier: ${ACCOUNT_IDENTIFIER}
              project_name: ${DCM_DATABASE}.${DCM_SCHEMA}.${PROJECT_PREFIX}_UAT
              project_owner: ${PROJECT_OWNER}
              templating_config: UAT

            PROD:
              account_identifier: ${ACCOUNT_IDENTIFIER}
              project_name: ${DCM_DATABASE}.${DCM_SCHEMA}.${PROJECT_PREFIX}_PROD
              project_owner: ${PROJECT_OWNER}
              templating_config: PROD

          templating:

            configurations:

              DEV:
                environment: DEV
                business_schema: ${SCHEMA_NAME}

              QA:
                environment: QA
                business_schema: ${SCHEMA_NAME}

              UAT:
                environment: UAT
                business_schema: ${SCHEMA_NAME}

              PROD:
                environment: PROD
                business_schema: ${SCHEMA_NAME}
          EOF

            echo "Generated manifest.yml"

          else

            echo "Existing manifest.yml preserved."

          fi

          # --------------------------------------------------
          # 3.3 FUNCTION TO CREATE INDIVIDUAL SQL FILES
          # --------------------------------------------------

          create_sql_file() {

            FILE_PATH="$1"
            DESCRIPTION="$2"
            OBJECT_NAME="$3"

            if [ ! -f "${FILE_PATH}" ]; then

              cat > "${FILE_PATH}" <<EOF
          -- ==================================================
          -- ${DESCRIPTION}
          -- ==================================================
          --
          -- DCM Project : ${PROJECT_PREFIX}
          -- Business Schema : ${SCHEMA_NAME}
          -- Object Name : ${OBJECT_NAME}
          --
          -- Add the corresponding Snowflake DCM definition.
          --
          -- IMPORTANT:
          -- DCM definition files must use supported DEFINE,
          -- GRANT or ATTACH statements.
          --
          -- Replace this template with a valid DCM definition.
          --
          -- ==================================================
          EOF

              echo "Created: ${FILE_PATH}"

            else

              echo "Preserved existing file: ${FILE_PATH}"

            fi
          }

          # --------------------------------------------------
          # 3.4 DATABASE DEFINITION
          # --------------------------------------------------

          create_sql_file \
            "${PROJECT_DIR}/sources/definitions/database/${LOWER_SCHEMA}_database.sql" \
            "DATABASE DEFINITION" \
            "${SCHEMA_NAME}_DATABASE"

          # --------------------------------------------------
          # 3.5 SCHEMA DEFINITION
          # --------------------------------------------------

          create_sql_file \
            "${PROJECT_DIR}/sources/definitions/schemas/${LOWER_SCHEMA}_schema.sql" \
            "SCHEMA DEFINITION" \
            "${SCHEMA_NAME}"

          # --------------------------------------------------
          # 3.6 INDIVIDUAL TABLE DEFINITIONS
          # --------------------------------------------------

          create_sql_file \
            "${PROJECT_DIR}/sources/definitions/tables/sample_table_01.sql" \
            "TABLE DEFINITION" \
            "SAMPLE_TABLE_01"

          # --------------------------------------------------
          # 3.7 INDIVIDUAL VIEW DEFINITIONS
          # --------------------------------------------------

          create_sql_file \
            "${PROJECT_DIR}/sources/definitions/views/sample_view_01.sql" \
            "VIEW DEFINITION" \
            "SAMPLE_VIEW_01"

          # --------------------------------------------------
          # 3.8 INDIVIDUAL STORED PROCEDURE DEFINITIONS
          # --------------------------------------------------

          create_sql_file \
            "${PROJECT_DIR}/sources/definitions/procedures/sample_procedure_01.sql" \
            "STORED PROCEDURE DEFINITION" \
            "SAMPLE_PROCEDURE_01"

          # --------------------------------------------------
          # 3.9 INDIVIDUAL FUNCTION DEFINITIONS
          # --------------------------------------------------

          create_sql_file \
            "${PROJECT_DIR}/sources/definitions/functions/sample_function_01.sql" \
            "FUNCTION DEFINITION" \
            "SAMPLE_FUNCTION_01"

          # --------------------------------------------------
          # 3.10 INDIVIDUAL STREAM DEFINITIONS
          # --------------------------------------------------

          create_sql_file \
            "${PROJECT_DIR}/sources/definitions/streams/sample_stream_01.sql" \
            "STREAM DEFINITION" \
            "SAMPLE_STREAM_01"

          # --------------------------------------------------
          # 3.11 INDIVIDUAL TASK DEFINITIONS
          # --------------------------------------------------

          create_sql_file \
            "${PROJECT_DIR}/sources/definitions/tasks/sample_task_01.sql" \
            "TASK DEFINITION" \
            "SAMPLE_TASK_01"

          # --------------------------------------------------
          # 3.12 INDIVIDUAL GRANT DEFINITIONS
          # --------------------------------------------------

          create_sql_file \
            "${PROJECT_DIR}/sources/definitions/grants/sample_grant_01.sql" \
            "GRANT DEFINITION" \
            "SAMPLE_GRANT_01"

          # --------------------------------------------------
          # 3.13 CREATE COMMON MACRO
          # --------------------------------------------------

          if [ ! -f "${PROJECT_DIR}/sources/macros/common.sql" ]; then

            cat > "${PROJECT_DIR}/sources/macros/common.sql" <<'EOF'
          -- ==================================================
          -- COMMON DCM SQL MACROS
          -- ==================================================
          --
          -- Maintain reusable Jinja2 macros here.
          --
          -- These macros are automatically available
          -- to DCM definition files.
          --
          -- Add valid Snowflake DCM macros here.
          --
          -- ==================================================
          EOF

          fi

          # --------------------------------------------------
          # 3.14 CREATE PROJECT GITIGNORE
          # --------------------------------------------------

          if [ ! -f "${PROJECT_DIR}/.gitignore" ]; then

            cat > "${PROJECT_DIR}/.gitignore" <<'EOF'
          .DS_Store
          *.log
          *.tmp
          .env
          .venv/
          __pycache__/
          /out/
          EOF

          fi

          # --------------------------------------------------
          # 3.15 CREATE PROJECT README
          # --------------------------------------------------

          if [ ! -f "${PROJECT_DIR}/README.md" ]; then

            cat > "${PROJECT_DIR}/README.md" <<EOF
          # ${PROJECT_PREFIX}

          ## 1. Project Overview

          This project manages Snowflake Data Cloud Management
          (DCM) definitions for the business schema:

          **Business Schema:** ${SCHEMA_NAME}

          **DCM Project:** ${PROJECT_PREFIX}

          **DCM Project Owner:** ${PROJECT_OWNER}

          This project uses Git-based version control to manage
          Snowflake database object definitions.

          ## 2. Project Objectives

          - Maintain individual SQL files for database objects.
          - Organize SQL definitions by object type.
          - Support DEV, QA, UAT and PROD environments.
          - Maintain version-controlled definitions.
          - Support controlled DCM Plan and Deploy operations.
          - Provide deployment traceability.

          ## 3. Project Structure

          \`\`\`text
          ${PROJECT_PREFIX}/
          |
          |-- manifest.yml
          |-- README.md
          |-- .gitignore
          |
          |-- sources/
          |   |
          |   |-- definitions/
          |   |   |
          |   |   |-- database/
          |   |   |-- schemas/
          |   |   |-- tables/
          |   |   |-- views/
          |   |   |-- procedures/
          |   |   |-- functions/
          |   |   |-- streams/
          |   |   |-- tasks/
          |   |   |-- grants/
          |   |
          |   |-- macros/
          |       |-- common.sql
          \`\`\`

          ## 4. SQL File Organization

          Each database object must be maintained in
          an independent SQL definition file.

          | Folder | Purpose |
          |---|---|
          | database | Database definitions |
          | schemas | Schema definitions |
          | tables | Individual table definitions |
          | views | Individual view definitions |
          | procedures | Individual stored procedures |
          | functions | Individual function definitions |
          | streams | Individual stream definitions |
          | tasks | Individual task definitions |
          | grants | Individual grant definitions |

          Example:

          \`\`\`text
          tables/
          |
          |-- customer.sql
          |-- orders.sql
          |-- products.sql
          |-- employees.sql
          \`\`\`

          Every object should have its own SQL file.

          Additional object files can be created without
          changing the GitHub Actions workflow.

          ## 5. Manifest Configuration

          The manifest.yml contains:

          - Snowflake account identifier.
          - DEV, QA, UAT and PROD targets.
          - Environment-specific DCM project names.
          - Project owner role.
          - Templating configurations.

          The DCM project objects are located under:

          ${DCM_DATABASE}.${DCM_SCHEMA}

          The managed business schema is:

          ${SCHEMA_NAME}

          These are separate configuration concepts.

          ## 6. Environment Configuration

          | Environment | DCM Project |
          |---|---|
          | DEV | ${PROJECT_PREFIX}_DEV |
          | QA | ${PROJECT_PREFIX}_QA |
          | UAT | ${PROJECT_PREFIX}_UAT |
          | PROD | ${PROJECT_PREFIX}_PROD |

          ## 7. Development Guidelines

          1. Create one SQL file per database object.
          2. Place the file in the corresponding object folder.
          3. Use valid Snowflake DCM DEFINE, GRANT or ATTACH syntax.
          4. Follow consistent object naming conventions.
          5. Commit changes to the appropriate Git branch.
          6. Execute DCM Plan.
          7. Review proposed changes.
          8. Deploy after required approvals.
          9. Validate the deployed objects.

          ## 8. Deployment Promotion

          Recommended sequence:

          DEV -> QA -> UAT -> PROD

          - DEV: Development and initial validation.
          - QA: Integration and regression testing.
          - UAT: Business acceptance testing.
          - PROD: Approved production deployment.

          ## 9. Deployment Prerequisites

          - DCM project objects must exist in Snowflake.
          - Manifest values must be validated.
          - Project owner roles must be configured.
          - Required Snowflake privileges must be granted.
          - Snowflake CLI must be configured.
          - Secure authentication must be available.
          - SQL definitions must contain valid DCM syntax.

          ## 10. Important Considerations

          - Bootstrap creates Git directories and files only.
          - It does not create Snowflake DCM project objects.
          - It does not create database objects.
          - Generated SQL files are starter templates.
          - Replace templates with actual DCM definitions.
          - Existing SQL files are preserved during bootstrap.
          - Existing manifest.yml is preserved during bootstrap.
          - Git deletion does not automatically drop Snowflake objects.

          ## 11. Project Ownership

          Project Owner: ${PROJECT_OWNER}

          Business Schema: ${SCHEMA_NAME}

          Environments: DEV, QA, UAT, PROD

          Framework: Snowflake DCM with GitHub Actions

          EOF

          fi

          echo "DCM project structure successfully created."

      # --------------------------------------------------
      # 4. CREATE DCM PLAN WORKFLOW PLACEHOLDER
      # --------------------------------------------------

      - name: Create DCM Plan workflow placeholder
        shell: bash
        run: |

          set -euo pipefail

          if [ ! -f ".github/workflows/dcm-plan.yml" ]; then

            cat > ".github/workflows/dcm-plan.yml" <<'EOF'
          name: Snowflake DCM Plan

          on:
            workflow_dispatch:

          jobs:
            dcm-plan:
              runs-on: ubuntu-latest

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4

                - name: Configure Snowflake CLI
                  run: echo "Configure Snowflake CLI here"

                - name: Execute DCM Plan
                  run: echo "Configure snow dcm plan here"
          EOF

          fi

      # --------------------------------------------------
      # 5. CREATE DCM DEPLOY WORKFLOW PLACEHOLDER
      # --------------------------------------------------

      - name: Create DCM Deploy workflow placeholder
        shell: bash
        run: |

          set -euo pipefail

          if [ ! -f ".github/workflows/dcm-deploy.yml" ]; then

            cat > ".github/workflows/dcm-deploy.yml" <<'EOF'
          name: Snowflake DCM Deploy

          on:
            workflow_dispatch:

          jobs:
            dcm-deploy:
              runs-on: ubuntu-latest

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4

                - name: Configure Snowflake CLI
                  run: echo "Configure Snowflake CLI here"

                - name: Execute DCM Deploy
                  run: echo "Configure snow dcm deploy here"
          EOF

          fi

      # --------------------------------------------------
      # 6. GENERATE REPOSITORY PROJECT INVENTORY
      # --------------------------------------------------

      - name: Generate repository README
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |

          set -euo pipefail

          PROJECT_LIST=""

          shopt -s nullglob

          for dir in DCM_*; do

            if [ -d "${dir}" ] && [ -f "${dir}/manifest.yml" ]; then

              PROJECT_SCHEMA="${dir#DCM_}"

              PROJECT_LIST="${PROJECT_LIST}- **${PROJECT_SCHEMA}** - \`${dir}\`"$'\n'

            fi

          done

          if [ -z "${PROJECT_LIST}" ]; then
            PROJECT_LIST="- No DCM projects found yet."
          fi

          cat > README.md <<EOF
          # Snowflake DCM Git Repository

          ## 1. Overview

          Centralized Git repository for managing Snowflake
          Data Cloud Management (DCM) projects.

          Each business schema is maintained through
          an independent DCM project.

          ## 2. Repository Architecture

          \`\`\`text
          Repository/
          |
          |-- .github/
          |   |-- workflows/
          |       |-- bootstrap-structure.yml
          |       |-- delete-structure.yml
          |       |-- dcm-plan.yml
          |       |-- dcm-deploy.yml
          |
          |-- DCM_SCHEMA01/
          |   |-- manifest.yml
          |   |-- README.md
          |   |-- sources/
          |       |-- definitions/
          |       |   |-- database/
          |       |   |-- schemas/
          |       |   |-- tables/
          |       |   |-- views/
          |       |   |-- procedures/
          |       |   |-- functions/
          |       |   |-- streams/
          |       |   |-- tasks/
          |       |   |-- grants/
          |       |
          |       |-- macros/
          |
          |-- DCM_SCHEMA02/
          |-- README.md
          \`\`\`

          ## 3. Current DCM Projects

          ${PROJECT_LIST}

          ## 4. Supported Environments

          | Environment | Branch |
          |---|---|
          | DEV | dev |
          | QA | qa |
          | UAT | uat |
          | PROD | prod |

          ## 5. Creating a New DCM Project

          1. Navigate to GitHub Actions.
          2. Select Bootstrap Snowflake DCM Project Structure.
          3. Click Run workflow.
          4. Select the target Git branch.
          5. Enter the Snowflake business schema name.
          6. Enter the Snowflake account identifier.
          7. Enter the DCM database.
          8. Enter the DCM schema.
          9. Execute the workflow.

          ## 6. Generated Project Structure

          The workflow automatically creates:

          - DCM project directory.
          - Environment-specific manifest.yml.
          - Separate SQL folders by object type.
          - Individual SQL starter files.
          - Common macro file.
          - Project README.
          - DCM Plan workflow placeholder.
          - DCM Deploy workflow placeholder.

          ## 7. SQL Definition Management

          Each database object must have its own SQL file.

          For example:

          \`\`\`text
          definitions/
          |
          |-- tables/
          |   |-- customer.sql
          |   |-- orders.sql
          |   |-- products.sql
          |
          |-- views/
          |   |-- customer_view.sql
          |   |-- order_view.sql
          |
          |-- procedures/
          |   |-- process_orders.sql
          \`\`\`

          New SQL files can be added without modifying
          the bootstrap workflow.

          ## 8. Git Promotion Strategy

          DEV -> QA -> UAT -> PROD

          Use Pull Requests, branch protection and approvals
          to control environment promotions.

          ## 9. Snowflake Deployment

          The DCM Plan and Deploy workflows are generated
          as placeholders.

          Configure Snowflake CLI, authentication and actual
          DCM commands before using automated deployments.

          ## 10. Security

          The bootstrap workflow uses BOOTSTRAP_TOKEN
          for repository checkout and push operations.

          Snowflake credentials must be stored securely.

          Never commit passwords, private keys or tokens.

          ## 11. Important Considerations

          - Bootstrap creates Git structures only.
          - Snowflake DCM objects must be created separately.
          - SQL templates must be replaced with valid definitions.
          - Existing project files are preserved.
          - Git deletion does not drop Snowflake objects.
          - Git promotion and Snowflake deployment are separate.

          ---

          Repository: SNOWFLAKE_SCHEMA01

          Framework: Snowflake DCM with GitHub Actions

          Supported Environments: DEV, QA, UAT, PROD

          Strategy: One DCM project per business schema.

          EOF

          echo "Repository README generated successfully."

      # --------------------------------------------------
      # 7. COMMIT AND PUSH CHANGES
      # --------------------------------------------------

      - name: Commit and push structure
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |

          set -euo pipefail

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "No changes required."

          else

            git commit -m "Initialize DCM project for ${SCHEMA_NAME}"

            git push origin "HEAD:${TARGET_BRANCH}"

            echo "Successfully pushed DCM project structure."

          fi
