
name: Delete Snowflake DCM Project Structure

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch from which the DCM project structure should be deleted"
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

      schema_name:
        description: "Snowflake schema name"
        required: true
        default: "TPCH_SF1"
        type: string

permissions:
  contents: write

jobs:
  delete-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.BOOTSTRAP_TOKEN }}
          fetch-depth: 0

      - name: Delete DCM project structure
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          # Generate project directory from schema name
          PROJECT_DIR="DCM_${SCHEMA_NAME}"

          echo "======================================"
          echo "Deleting Snowflake DCM project"
          echo "Project: ${PROJECT_DIR}"
          echo "Schema: ${SCHEMA_NAME}"
          echo "======================================"

          # Validate project directory name
          if [[ ! "${SCHEMA_NAME}" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "ERROR: Invalid schema name."
            exit 1
          fi

          # Delete complete DCM project directory
          if [ -d "${PROJECT_DIR}" ]; then
            rm -rf "${PROJECT_DIR}"
            echo "Deleted project directory: ${PROJECT_DIR}"
          else
            echo "Project directory does not exist: ${PROJECT_DIR}"
          fi

          # Delete supporting DCM workflows
          rm -f ".github/workflows/dcm-plan.yml"
          rm -f ".github/workflows/dcm-deploy.yml"

          # Delete repository README created by bootstrap
          rm -f "README.md"

          echo "DCM project structure deletion completed."

      - name: Commit and push deletion
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No files to delete."
          else
            git commit -m "Remove Snowflake DCM project structure"

            git push origin "HEAD:${TARGET_BRANCH}"

            echo "Deletion committed and pushed successfully."
          fi
