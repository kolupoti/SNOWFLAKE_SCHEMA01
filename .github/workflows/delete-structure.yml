
      # Step 3: Delete DCM project, GitHub workflows, and README files
      - name: Delete DCM project, workflows, and README files
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          PROJECT_DIR="DCM_${SCHEMA_NAME}"

          echo "=========================================="
          echo "Starting repository cleanup"
          echo "=========================================="

          # Delete selected DCM project directory
          if [ -e "${PROJECT_DIR}" ] || [ -L "${PROJECT_DIR}" ]; then
            rm -rf -- "${PROJECT_DIR}"
            echo "Deleted ${PROJECT_DIR}"
          fi

          # Delete all GitHub workflow files and subdirectories
          if [ -e ".github/workflows" ] || [ -L ".github/workflows" ]; then
            rm -rf -- ".github/workflows"
            echo "Deleted .github/workflows"
          fi

          # Delete .github directory if empty
          if [ -d ".github" ] && [ -z "$(ls -A .github)" ]; then
            rmdir .github
            echo "Deleted empty .github directory"
          fi

          # Delete repository-level README.md (case-sensitive)
          if [ -f "README.md" ]; then
            rm -f -- "README.md"
            echo "Deleted repository README.md"
          fi

          # Delete project-level README files if any remain
          find . -type f -iname "README.md" -delete

          echo "Repository cleanup completed."
