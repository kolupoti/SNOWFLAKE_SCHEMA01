
name: Delete Snowflake DCM Project Structure

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch from which the DCM project structure should be deleted"
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

      schema_name:
        description: "Enter the Snowflake schema name to delete (e.g., TPCH_SF1, SALES, FINANCE)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete-structure:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout selected branch
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.BOOTSTRAP_TOKEN }}
          fetch-depth: 0

      # Step 2: Validate schema name
      - name: Validate schema name
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          if [[ ! "${SCHEMA_NAME}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "ERROR: Invalid schema name: ${SCHEMA_NAME}"
            echo "Use letters, numbers and underscores."
            exit 1
          fi

          echo "Schema name validated: ${SCHEMA_NAME}"

      # Step 3: Delete DCM project and GitHub workflows
      - name: Delete DCM project and GitHub workflows
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          PROJECT_DIR="DCM_${SCHEMA_NAME}"

          echo "=========================================="
          echo "Starting Snowflake DCM repository cleanup"
          echo "Schema: ${SCHEMA_NAME}"
          echo "Project directory: ${PROJECT_DIR}"
          echo "=========================================="

          # Delete selected DCM project directory
          if [ -e "${PROJECT_DIR}" ] || [ -L "${PROJECT_DIR}" ]; then
            rm -rf -- "${PROJECT_DIR}"
            echo "SUCCESS: Deleted ${PROJECT_DIR}"
          else
            echo "INFO: ${PROJECT_DIR} does not exist."
          fi

          # Delete .github/workflows regardless of its contents
          if [ -e ".github/workflows" ] || [ -L ".github/workflows" ]; then
            rm -rf -- ".github/workflows"
            echo "SUCCESS: Deleted .github/workflows and all its contents."
          else
            echo "INFO: .github/workflows does not exist."
          fi

          # Delete .github directory if it is empty
          if [ -d ".github" ] && [ -z "$(ls -A .github)" ]; then
            rmdir .github
            echo "SUCCESS: Deleted empty .github directory."
          fi

          echo "=========================================="
          echo "Repository cleanup completed."
          echo "=========================================="

      # Step 4: Commit and push deletion
      - name: Commit and push deletion
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all deleted files and directories
          git add -A

          # Check whether there are changes to commit
          if git diff --cached --quiet; then
            echo "No files or directories were deleted. Nothing to commit."
          else
            git commit -m "Remove DCM project and GitHub workflows for ${SCHEMA_NAME}"

            # Push deletion to selected branch
            git push origin "HEAD:${TARGET_BRANCH}"

            echo "SUCCESS: Deletions committed and pushed to ${TARGET_BRANCH}."
          fi

      # Step 5: Verify deletion
      - name: Verify deletion
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          PROJECT_DIR="DCM_${SCHEMA_NAME}"

          echo "Verifying deletion..."

          if [ -e "${PROJECT_DIR}" ] || [ -L "${PROJECT_DIR}" ]; then
            echo "ERROR: ${PROJECT_DIR} still exists."
            exit 1
          fi

          if [ -e ".github/workflows" ] || [ -L ".github/workflows" ]; then
            echo "ERROR: .github/workflows still exists."
            exit 1
          fi

          echo "SUCCESS: DCM project directory is deleted."
          echo "SUCCESS: .github/workflows directory is deleted."
