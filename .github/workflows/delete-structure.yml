
name: Delete Snowflake DCM Project Structure

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch from which the complete DCM structure should be deleted"
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

      schema_name:
        description: "Enter the Snowflake schema name to delete (e.g., TPCH_SF1, SALES, FINANCE)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete-structure:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT TARGET BRANCH
      # --------------------------------------------------

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.BOOTSTRAP_TOKEN }}
          fetch-depth: 0

      # --------------------------------------------------
      # 2. VALIDATE SCHEMA NAME
      # --------------------------------------------------

      - name: Validate schema name
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -euo pipefail

          if [[ ! "${SCHEMA_NAME}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "ERROR: Invalid schema name: ${SCHEMA_NAME}"
            echo "Use letters, numbers and underscores."
            exit 1
          fi

          echo "Schema name validated: ${SCHEMA_NAME}"

      # --------------------------------------------------
      # 3. DELETE COMPLETE DCM PROJECT STRUCTURE
      # --------------------------------------------------

      - name: Delete DCM project and shared repository files
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -euo pipefail

          PROJECT_DIR="DCM_${SCHEMA_NAME}"

          echo "=========================================="
          echo "Deleting Snowflake DCM repository structure"
          echo "Project: ${PROJECT_DIR}"
          echo "Schema: ${SCHEMA_NAME}"
          echo "=========================================="

          # ----------------------------------------------
          # Verify selected DCM project exists
          # ----------------------------------------------

          if [ ! -d "${PROJECT_DIR}" ]; then
            echo "ERROR: Project directory does not exist: ${PROJECT_DIR}"
            exit 1
          fi

          # ----------------------------------------------
          # 1. DELETE COMPLETE DCM PROJECT DIRECTORY
          # ----------------------------------------------

          rm -rf -- "${PROJECT_DIR}"

          echo "Deleted: ${PROJECT_DIR}/"

          # ----------------------------------------------
          # 2. DELETE DCM PLAN WORKFLOW
          # ----------------------------------------------

          if [ -f ".github/workflows/dcm-plan.yml" ]; then
            rm -f -- ".github/workflows/dcm-plan.yml"
            echo "Deleted: .github/workflows/dcm-plan.yml"
          fi

          # ----------------------------------------------
          # 3. DELETE DCM DEPLOY WORKFLOW
          # ----------------------------------------------

          if [ -f ".github/workflows/dcm-deploy.yml" ]; then
            rm -f -- ".github/workflows/dcm-deploy.yml"
            echo "Deleted: .github/workflows/dcm-deploy.yml"
          fi

          # ----------------------------------------------
          # 4. DELETE ROOT REPOSITORY README
          # ----------------------------------------------

          if [ -f "README.md" ]; then
            rm -f -- "README.md"
            echo "Deleted: README.md"
          fi

          # ----------------------------------------------
          # 5. REMOVE EMPTY GITHUB DIRECTORIES
          # ----------------------------------------------

          # Preserve bootstrap and delete workflow files.
          # Remove directories only if they are empty.

          if [ -d ".github/workflows" ]; then
            rmdir ".github/workflows" 2>/dev/null || true
          fi

          if [ -d ".github" ]; then
            rmdir ".github" 2>/dev/null || true
          fi

          echo "=========================================="
          echo "Requested DCM structure deletion completed."
          echo "=========================================="

      # --------------------------------------------------
      # 4. VERIFY DELETION
      # --------------------------------------------------

      - name: Verify DCM structure deletion
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -euo pipefail

          PROJECT_DIR="DCM_${SCHEMA_NAME}"

          echo "Verifying deleted files..."

          FAILED=0

          # Verify project directory
          if [ -e "${PROJECT_DIR}" ]; then
            echo "ERROR: ${PROJECT_DIR} still exists."
            FAILED=1
          fi

          # Verify DCM Plan workflow
          if [ -e ".github/workflows/dcm-plan.yml" ]; then
            echo "ERROR: dcm-plan.yml still exists."
            FAILED=1
          fi

          # Verify DCM Deploy workflow
          if [ -e ".github/workflows/dcm-deploy.yml" ]; then
            echo "ERROR: dcm-deploy.yml still exists."
            FAILED=1
          fi

          # Verify root README
          if [ -e "README.md" ]; then
            echo "ERROR: README.md still exists."
            FAILED=1
          fi

          # Verify Bootstrap workflow is preserved
          if [ ! -f ".github/workflows/bootstrap-structure.yml" ]; then
            echo "ERROR: bootstrap-structure.yml is missing."
            FAILED=1
          fi

          # Verify Delete workflow is preserved
          if [ ! -f ".github/workflows/delete-structure.yml" ]; then
            echo "ERROR: delete-structure.yml is missing."
            FAILED=1
          fi

          if [ "${FAILED}" -ne 0 ]; then
            echo "ERROR: Deletion verification failed."
            exit 1
          fi

          echo "All requested files have been deleted."
          echo "Bootstrap and Delete workflows are preserved."

      # --------------------------------------------------
      # 5. COMMIT AND PUSH DELETION
      # --------------------------------------------------

      - name: Commit and push deletion
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all deletions and modifications
          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
          else

            git commit -m \
              "Delete DCM project and repository structure for ${SCHEMA_NAME}"

            git push origin "HEAD:${TARGET_BRANCH}"

            echo "=========================================="
            echo "DCM REPOSITORY CLEANUP SUCCESSFUL"
            echo "=========================================="

            echo "Deleted:"
            echo "- ${SCHEMA_NAME} DCM project directory"
            echo "- .github/workflows/dcm-plan.yml"
            echo "- .github/workflows/dcm-deploy.yml"
            echo "- Root README.md"

            echo ""
            echo "Preserved:"
            echo "- .github/workflows/bootstrap-structure.yml"
            echo "- .github/workflows/delete-structure.yml"

            echo ""
            echo "Branch: ${TARGET_BRANCH}"
            echo "Commit and push completed successfully."

          fi
