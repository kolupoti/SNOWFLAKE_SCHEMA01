
      - name: Delete DCM project structure and workflows
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          PROJECT_DIR="DCM_${SCHEMA_NAME}"

          echo "Deleting project: ${PROJECT_DIR}"

          if [ ! -d "${PROJECT_DIR}" ]; then
            echo "ERROR: Project directory does not exist: ${PROJECT_DIR}"
            exit 1
          fi

          # Delete the selected DCM project
          rm -rf -- "${PROJECT_DIR}"
          echo "Deleted: ${PROJECT_DIR}"

          # Delete GitHub workflow files
          if [ -d ".github/workflows" ]; then
            rm -rf -- ".github/workflows"
            echo "Deleted: .github/workflows"
          else
            echo ".github/workflows does not exist."
          fi

          # Remove .github if it is empty
          if [ -d ".github" ] && [ -z "$(ls -A .github)" ]; then
            rmdir .github
            echo "Deleted empty .github directory."
          fi

          echo "Deletion completed."
