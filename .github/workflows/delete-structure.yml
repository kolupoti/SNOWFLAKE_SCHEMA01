
      - name: Delete complete DCM repository structure
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -euo pipefail

          PROJECT_DIR="DCM_${SCHEMA_NAME}"

          echo "======================================"
          echo "Deleting DCM repository structure"
          echo "Project: ${PROJECT_DIR}"
          echo "======================================"

          # Verify selected project exists
          if [ ! -d "${PROJECT_DIR}" ]; then
            echo "ERROR: Project directory does not exist: ${PROJECT_DIR}"
            exit 1
          fi

          # 1. Delete complete schema-specific DCM project
          rm -rf -- "${PROJECT_DIR}"

          echo "Deleted: ${PROJECT_DIR}"

          # 2. Delete shared DCM Plan workflow
          if [ -f ".github/workflows/dcm-plan.yml" ]; then
            rm -f ".github/workflows/dcm-plan.yml"
            echo "Deleted: .github/workflows/dcm-plan.yml"
          fi

          # 3. Delete shared DCM Deploy workflow
          if [ -f ".github/workflows/dcm-deploy.yml" ]; then
            rm -f ".github/workflows/dcm-deploy.yml"
            echo "Deleted: .github/workflows/dcm-deploy.yml"
          fi

          # 4. Delete repository-level README
          if [ -f "README.md" ]; then
            rm -f "README.md"
            echo "Deleted: README.md"
          fi

          # 5. Remove empty workflow directories only
          if [ -d ".github/workflows" ]; then
            rmdir ".github/workflows" 2>/dev/null || true
          fi

          if [ -d ".github" ]; then
            rmdir ".github" 2>/dev/null || true
          fi

          echo "======================================"
          echo "DCM repository structure deletion completed."
          echo "======================================"
