
      - name: Delete DCM project and GitHub workflows
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          PROJECT_DIR="DCM_${SCHEMA_NAME}"

          echo "Deleting DCM project: ${PROJECT_DIR}"

          # Delete selected DCM project
          if [ -d "${PROJECT_DIR}" ]; then
            rm -rf -- "${PROJECT_DIR}"
            echo "Deleted ${PROJECT_DIR}"
          else
            echo "Project directory not found: ${PROJECT_DIR}"
          fi

          # Delete .github/workflows unconditionally if it exists
          if [ -e ".github/workflows" ] || [ -L ".github/workflows" ]; then
            rm -rf -- ".github/workflows"
            echo "Successfully deleted .github/workflows and all its contents."
          else
            echo ".github/workflows does not exist."
          fi

          # Delete .github if it is now empty
          if [ -d ".github" ] && [ -z "$(ls -A .github)" ]; then
            rmdir .github
            echo "Successfully deleted empty .github directory."
          fi

          echo "Deletion completed."
