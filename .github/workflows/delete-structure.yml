
name: Delete Snowflake DCM Project Structure

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch from which the DCM project structure should be deleted"
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

      schema_name:
        description: "Enter the Snowflake schema name to delete (e.g., TPCH_SF1, SALES, FINANCE)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete-structure:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # STEP 1: CHECKOUT SELECTED BRANCH
      # --------------------------------------------------

      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.BOOTSTRAP_TOKEN }}
          fetch-depth: 0

      # --------------------------------------------------
      # STEP 2: VALIDATE SCHEMA NAME
      # --------------------------------------------------

      - name: Validate schema name
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          if [[ ! "${SCHEMA_NAME}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "ERROR: Invalid schema name: ${SCHEMA_NAME}"
            echo "Use letters, numbers and underscores."
            exit 1
          fi

          echo "Schema name validated: ${SCHEMA_NAME}"

      # --------------------------------------------------
      # STEP 3: DELETE SELECTED DCM PROJECT
      # --------------------------------------------------

      - name: Delete DCM project directory
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          PROJECT_DIR="DCM_${SCHEMA_NAME}"

          echo "=========================================="
          echo "Starting DCM project deletion"
          echo "Schema: ${SCHEMA_NAME}"
          echo "Project: ${PROJECT_DIR}"
          echo "=========================================="

          if [ -e "${PROJECT_DIR}" ] || [ -L "${PROJECT_DIR}" ]; then
            rm -rf -- "${PROJECT_DIR}"
            echo "SUCCESS: Deleted ${PROJECT_DIR} and all contents."
          else
            echo "INFO: ${PROJECT_DIR} does not exist."
          fi

      # --------------------------------------------------
      # STEP 4: CHECK REMAINING DCM PROJECTS
      # --------------------------------------------------

      - name: Check remaining DCM projects
        id: remaining-projects
        shell: bash
        run: |
          set -e

          REMAINING_PROJECTS=$(find . \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -name 'DCM_*' \
            -print)

          if [ -z "${REMAINING_PROJECTS}" ]; then
            echo "remaining=false" >> "$GITHUB_OUTPUT"
            echo "No DCM projects remain."
          else
            echo "remaining=true" >> "$GITHUB_OUTPUT"

            echo "Other DCM projects still exist:"
            echo "${REMAINING_PROJECTS}"
          fi

      # --------------------------------------------------
      # STEP 5: DELETE SHARED DCM WORKFLOWS
      # --------------------------------------------------

      - name: Delete shared DCM Plan and Deploy workflows
        if: steps.remaining-projects.outputs.remaining == 'false'
        shell: bash
        run: |
          set -e

          echo "No DCM projects remain."
          echo "Deleting generated DCM workflows."

          for workflow in \
            ".github/workflows/dcm-plan.yml" \
            ".github/workflows/dcm-deploy.yml"; do

            if [ -e "${workflow}" ] || [ -L "${workflow}" ]; then
              rm -f -- "${workflow}"
              echo "SUCCESS: Deleted ${workflow}"
            else
              echo "INFO: ${workflow} does not exist."
            fi

          done

      # --------------------------------------------------
      # STEP 6: PRESERVE SHARED WORKFLOWS
      # --------------------------------------------------

      - name: Preserve shared DCM workflows
        if: steps.remaining-projects.outputs.remaining == 'true'
        shell: bash
        run: |
          set -e

          echo "Other DCM projects remain."

          echo "Preserving:"
          echo ".github/workflows/dcm-plan.yml"
          echo ".github/workflows/dcm-deploy.yml"

      # --------------------------------------------------
      # STEP 7: UPDATE OR DELETE REPOSITORY README
      # --------------------------------------------------

      - name: Update repository README
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
          PROJECTS_REMAIN: ${{ steps.remaining-projects.outputs.remaining }}
        run: |
          set -e

          echo "=========================================="
          echo "Processing repository README"
          echo "=========================================="

          if [ "${PROJECTS_REMAIN}" = "false" ]; then

            # No DCM projects remain.
            # Delete repository-level README.

            if [ -e "README.md" ] || [ -L "README.md" ]; then
              rm -f -- "README.md"
              echo "SUCCESS: Deleted repository README.md."
            else
              echo "INFO: Repository README.md does not exist."
            fi

          else

            # Other DCM projects remain.
            # Preserve repository README and remove
            # only the deleted schema's project listing.

            if [ -f "README.md" ]; then

              TEMP_README=$(mktemp)

              awk -v schema="${SCHEMA_NAME}" '
                index($0, "- **" schema "** - `") == 0 {
                  print
                }
              ' README.md > "${TEMP_README}"

              cat "${TEMP_README}" > README.md

              rm -f "${TEMP_README}"

              echo "SUCCESS: Updated repository README."
              echo "Preserved documentation for remaining schemas."

            else
              echo "INFO: Repository README.md does not exist."
            fi

          fi

      # --------------------------------------------------
      # STEP 8: PRESERVE MANAGEMENT WORKFLOWS
      # --------------------------------------------------

      - name: Preserve Bootstrap and Delete workflows
        shell: bash
        run: |
          set -e

          echo "Preserving repository management workflows."

          for workflow in \
            ".github/workflows/bootstrap-structure.yml" \
            ".github/workflows/delete-structure.yml"; do

            if [ ! -f "${workflow}" ]; then
              echo "ERROR: Required workflow is missing: ${workflow}"
              exit 1
            fi

            echo "SUCCESS: Preserved ${workflow}."

          done

      # --------------------------------------------------
      # STEP 9: VERIFY PROJECT DELETION
      # --------------------------------------------------

      - name: Verify DCM project deletion
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          PROJECT_DIR="DCM_${SCHEMA_NAME}"

          echo "=========================================="
          echo "Verifying DCM project deletion"
          echo "=========================================="

          if [ -e "${PROJECT_DIR}" ] || [ -L "${PROJECT_DIR}" ]; then
            echo "ERROR: ${PROJECT_DIR} still exists."
            exit 1
          fi

          echo "SUCCESS: ${PROJECT_DIR} completely deleted."

      # --------------------------------------------------
      # STEP 10: VERIFY SHARED WORKFLOW CLEANUP
      # --------------------------------------------------

      - name: Verify shared workflow cleanup
        shell: bash
        env:
          PROJECTS_REMAIN: ${{ steps.remaining-projects.outputs.remaining }}
        run: |
          set -e

          echo "=========================================="
          echo "Verifying shared workflows"
          echo "=========================================="

          if [ "${PROJECTS_REMAIN}" = "false" ]; then

            for workflow in \
              ".github/workflows/dcm-plan.yml" \
              ".github/workflows/dcm-deploy.yml"; do

              if [ -e "${workflow}" ] || [ -L "${workflow}" ]; then
                echo "ERROR: ${workflow} still exists."
                exit 1
              fi

              echo "SUCCESS: ${workflow} deleted."

            done

            # Verify repository README
            if [ -e "README.md" ] || [ -L "README.md" ]; then
              echo "ERROR: Repository README.md still exists."
              exit 1
            fi

            echo "SUCCESS: Repository README.md deleted."

          else

            echo "Other DCM projects remain."

            # Shared workflows should not be removed
            # when other DCM projects still exist.

            for workflow in \
              ".github/workflows/dcm-plan.yml" \
              ".github/workflows/dcm-deploy.yml"; do

              if [ ! -f "${workflow}" ]; then
                echo "ERROR: Shared workflow missing: ${workflow}"
                exit 1
              fi

              echo "SUCCESS: Preserved ${workflow}."

            done

            if [ ! -f "README.md" ]; then
              echo "ERROR: Repository README.md is missing."
              exit 1
            fi

            echo "SUCCESS: Repository README.md preserved."

          fi

          # Verify management workflows
          for workflow in \
            ".github/workflows/bootstrap-structure.yml" \
            ".github/workflows/delete-structure.yml"; do

            if [ ! -f "${workflow}" ]; then
              echo "ERROR: Management workflow missing: ${workflow}"
              exit 1
            fi

            echo "SUCCESS: Preserved ${workflow}."

          done

          echo "=========================================="
          echo "Repository cleanup verification completed."
          echo "=========================================="

      # --------------------------------------------------
      # STEP 11: STAGE ALL DELETIONS AND MODIFICATIONS
      # --------------------------------------------------

      - name: Stage repository changes
        shell: bash
        run: |
          set -e

          git add -A

          echo "Staged repository changes:"
          git status --short

      # --------------------------------------------------
      # STEP 12: COMMIT AND PUSH DELETIONS
      # --------------------------------------------------

      - name: Commit and push deletion
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then

            echo "No repository changes to commit."

          else

            git commit -m \
              "Delete DCM project and generated files for ${SCHEMA_NAME}"

            git push origin "HEAD:${TARGET_BRANCH}"

            echo "=========================================="
            echo "SUCCESS: Repository cleanup committed."
            echo "Branch: ${TARGET_BRANCH}"
            echo "Schema: ${SCHEMA_NAME}"
            echo "=========================================="

          fi
