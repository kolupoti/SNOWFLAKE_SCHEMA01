
name: Delete Snowflake DCM Project Structure

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch from which the DCM project structure should be deleted"
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

      schema_name:
        description: "Enter the Snowflake schema name to delete (e.g., TPCH_SF1, SALES, FINANCE)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete-structure:
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout selected branch
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.BOOTSTRAP_TOKEN }}
          fetch-depth: 0

      # Step 2: Validate schema name
      - name: Validate schema name
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          if [[ ! "${SCHEMA_NAME}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "ERROR: Invalid schema name: ${SCHEMA_NAME}"
            echo "Use letters, numbers and underscores."
            exit 1
          fi

          echo "Schema name validated: ${SCHEMA_NAME}"

      # Step 3: Delete DCM project, workflows, and README files
      - name: Delete DCM project, workflows, and README files
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          PROJECT_DIR="DCM_${SCHEMA_NAME}"

          echo "=========================================="
          echo "Starting repository cleanup"
          echo "Schema: ${SCHEMA_NAME}"
          echo "Project: ${PROJECT_DIR}"
          echo "=========================================="

          # Delete selected DCM project directory
          if [ -e "${PROJECT_DIR}" ] || [ -L "${PROJECT_DIR}" ]; then
            rm -rf -- "${PROJECT_DIR}"
            echo "SUCCESS: Deleted ${PROJECT_DIR}"
          else
            echo "INFO: ${PROJECT_DIR} does not exist."
          fi

          # Delete .github/workflows and all its contents
          if [ -e ".github/workflows" ] || [ -L ".github/workflows" ]; then
            rm -rf -- ".github/workflows"
            echo "SUCCESS: Deleted .github/workflows and all contents."
          else
            echo "INFO: .github/workflows does not exist."
          fi

          # Delete .github directory if it is empty
          if [ -d ".github" ] && [ -z "$(ls -A .github)" ]; then
            rmdir .github
            echo "SUCCESS: Deleted empty .github directory."
          fi

          # Delete repository-level README.md
          if [ -f "README.md" ] || [ -L "README.md" ]; then
            rm -f -- "README.md"
            echo "SUCCESS: Deleted repository README.md."
          else
            echo "INFO: Repository README.md does not exist."
          fi

          # Delete all remaining nested README.md files
          find . -type f -iname "README.md" -delete

          echo "SUCCESS: Repository cleanup completed."

      # Step 4: Stage all deletions
      - name: Stage repository deletions
        shell: bash
        run: |
          set -e

          git add -A

          echo "Staged repository changes."

          git status --short

      # Step 5: Commit and push deletions
      - name: Commit and push deletion
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No files or directories were deleted."
          else
            git commit -m "Delete DCM project, workflows, and README for ${SCHEMA_NAME}"

            git push origin "HEAD:${TARGET_BRANCH}"

            echo "SUCCESS: Deletions committed and pushed to ${TARGET_BRANCH}."
          fi

      # Step 6: Verify deletion
      - name: Verify repository cleanup
        shell: bash
        env:
          SCHEMA_NAME: ${{ inputs.schema_name }}
        run: |
          set -e

          PROJECT_DIR="DCM_${SCHEMA_NAME}"

          echo "=========================================="
          echo "Verifying repository cleanup"
          echo "=========================================="

          # Verify DCM project deletion
          if [ -e "${PROJECT_DIR}" ] || [ -L "${PROJECT_DIR}" ]; then
            echo "ERROR: ${PROJECT_DIR} still exists."
            exit 1
          fi

          # Verify workflows deletion
          if [ -e ".github/workflows" ] || [ -L ".github/workflows" ]; then
            echo "ERROR: .github/workflows still exists."
            exit 1
          fi

          # Verify repository README deletion
          if [ -e "README.md" ] || [ -L "README.md" ]; then
            echo "ERROR: Repository README.md still exists."
            exit 1
          fi

          # Verify nested README deletion
          REMAINING_READMES=$(find . -type f -iname "README.md" -print)

          if [ -n "${REMAINING_READMES}" ]; then
            echo "ERROR: The following README files still exist:"
            echo "${REMAINING_READMES}"
            exit 1
          fi

          echo "SUCCESS: DCM project directory deleted."
          echo "SUCCESS: .github/workflows directory deleted."
          echo "SUCCESS: Repository README.md deleted."
          echo "SUCCESS: All nested README.md files deleted."

          echo "=========================================="
          echo "Repository cleanup verification completed."
          echo "=========================================="
