
name: Delete Snowflake Repository Structure

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch from which the structure should be deleted"
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

      schema_name:
        description: "Snowflake schema folder to delete"
        required: true
        default: "SCHEMA01"
        type: string

permissions:
  contents: write

jobs:
  delete-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.BOOTSTRAP_TOKEN }}
          fetch-depth: 0

      - name: Delete repository structure
        shell: bash
        env:
          SCHEMA: ${{ inputs.schema_name }}
        run: |
          set -e

          BASE="database/${SCHEMA}"

          echo "Deleting ${BASE}"

          if [ -d "${BASE}" ]; then
            rm -rf "${BASE}"
          fi

          # Delete supporting files created by bootstrap
          rm -f manifest.yml
          rm -f README.md
          rm -f .gitignore
          rm -f .github/workflows/deploy.yml

          echo "Repository structure deletion completed."

      - name: Commit and push deletion
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No files to delete."
          else
            git commit -m "Remove Snowflake repository structure"
            git push origin HEAD:${TARGET_BRANCH}
          fi
