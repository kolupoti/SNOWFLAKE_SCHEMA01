# WORKFLOW: DCM Plan
# Purpose: run a Snowflake DCM PLAN (dry run). Runs automatically on pull
#          requests, and can also be started manually from the Actions tab.
name: DCM Plan

on:
  # Automatic: PRs into dev or main that change files in my_dcm_project/
  pull_request:
    branches: [dev, main]
    paths: ["my_dcm_project/**"]

  # Manual: adds the "Run workflow" button in the Actions tab.
  # The person starting it picks the branch and the target.
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to plan against"
        required: true
        default: DEV
        type: choice
        options:
          - DEV
          - QA

permissions:
  contents: read
  id-token: write        # OIDC login to Snowflake
  pull-requests: write   # post the plan summary on PRs

jobs:
  # JOB 1: decide the environment
  setup:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.map.outputs.target }}      # DEV or QA
      env_name: ${{ steps.map.outputs.env_name }}  # dev or qa
    steps:
      # Manual run  -> use the target chosen in the dropdown
      # PR into main -> QA ; PR into dev -> DEV
      - id: map
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
          elif [ "${{ github.base_ref }}" = "main" ]; then
            TARGET="QA"
          else
            TARGET="DEV"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "env_name=$(echo "$TARGET" | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

  # JOB 2: run the plan against that target
  plan:
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.env_name }}   # dev or qa
    steps:
      # STEP 1: download the code from the selected branch
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # STEP 2: install Snowflake CLI, log in via OIDC, run the plan
      - uses: snowflakedb/snowflake-actions/dcm/plan@v3
        with:
          target: ${{ needs.setup.outputs.target }}
          project-path: my_dcm_project/
          snowflake-user: ${{ vars.SNOWFLAKE_USER }}
