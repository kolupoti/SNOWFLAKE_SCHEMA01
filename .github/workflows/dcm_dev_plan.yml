
name: DCM DEV Plan

on:
  pull_request:
    branches:
      - dev
    paths:
      - "my_dcm_project/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: DCM Plan - DEV
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: my_dcm_project

    env:
      SNOWFLAKE_ACCOUNT: JLWGRJE-OR02911
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
      SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2. Install Snowflake CLI
      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2
        with:
          cli-version: "3.24.0"

      # 3. Validate Snowflake connection
      - name: Test Snowflake connection
        run: snow connection test -x

      # 4. Execute DCM PLAN against DEV
      - name: DCM plan (DEV)
        shell: bash
        run: |
          set -o pipefail
          snow dcm plan --target DEV --save-output -x 2>&1 | tee plan.txt

      # 5. Upload DCM PLAN results as a GitHub artifact
      - name: Upload DCM plan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DCM-DEV-Plan-Results
          path: |
            my_dcm_project/plan.txt
            my_dcm_project/out/plan_result.json
          if-no-files-found: warn
          retention-days: 30

      # 6. Post DCM PLAN output to the pull request
      - name: Post plan to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const logFile = 'my_dcm_project/plan.txt';

            let body;

            if (fs.existsSync(logFile)) {
              body = fs.readFileSync(logFile, 'utf8');
            } else {
              body = 'DCM PLAN did not produce a log file. Please review the failed workflow step.';
            }

            if (body.length > 60000) {
              body = body.slice(0, 60000) + '\n... output truncated';
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '### DCM PLAN – DEV\n\n```text\n' + body + '\n```'
            });
