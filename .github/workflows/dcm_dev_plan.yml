
name: DCM DEV Plan

# Manual execution only
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: DCM Plan - DEV
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: JLWGRJE-OR02911
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
      SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2. Verify DCM project structure
      - name: Verify DCM project structure
        shell: bash
        run: |
          echo "Repository root:"
          pwd
          echo "Repository contents:"
          ls -la

          if [ ! -f "my_dcm_project/manifest.yml" ]; then
            echo "ERROR: DCM manifest not found."
            echo "Available manifest files:"
            find . -type f -name manifest.yml -not -path "./.git/*"
            exit 1
          fi

          echo "DCM manifest found."

      # 3. Install Snowflake CLI
      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2
        with:
          cli-version: "3.24.0"

      # 4. Test Snowflake connection
      - name: Test Snowflake connection
        shell: bash
        run: |
          snow connection test -x

      # 5. Execute DCM PLAN against DEV
      - name: DCM Plan - DEV
        shell: bash
        run: |
          set -o pipefail

          snow dcm plan \
            --from my_dcm_project \
            --target DEV \
            --save-output \
            -x 2>&1 | tee plan.txt

      # 6. Upload DCM PLAN results
      - name: Upload DCM Plan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DCM-DEV-Plan-Results
          path: |
            plan.txt
            my_dcm_project/out/plan_result.json
          if-no-files-found: warn
          retention-days: 30
