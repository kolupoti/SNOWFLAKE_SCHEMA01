
name: DCM DEV Plan

# Manual execution only
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: DCM Plan - DEV
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: JLWGRJE-OR02911
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
      SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

    steps:

      # 1. Checkout MAIN branch (workflow repository)
      - name: Checkout MAIN branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: workflow_source
          persist-credentials: false

      # 2. Checkout DEV branch (DCM project)
      - name: Checkout DEV branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dcm_source
          persist-credentials: false

      # 3. Verify DCM project structure
      - name: Verify DCM project structure
        shell: bash
        run: |
          echo "DCM project directory:"
          ls -la dcm_source/my_dcm_project

          if [ ! -f "dcm_source/my_dcm_project/manifest.yml" ]; then
            echo "ERROR: manifest.yml not found in DEV branch."
            exit 1
          fi

          echo "DCM manifest found successfully."

      # 4. Install Snowflake CLI
      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2
        with:
          cli-version: "3.24.0"

      # 5. Test Snowflake connection
      - name: Test Snowflake connection
        shell: bash
        run: |
          snow connection test -x

      # 6. Execute DCM PLAN against DEV
      - name: DCM Plan - DEV
        shell: bash
        run: |
          set -o pipefail

          snow dcm plan \
            --from dcm_source/my_dcm_project \
            --target DEV \
            --save-output \
            -x 2>&1 | tee plan.txt

      # 7. Verify DCM PLAN output
      - name: Verify DCM PLAN output
        if: success()
        shell: bash
        run: |
          echo "Generated DCM PLAN files:"

          ls -la dcm_source/my_dcm_project/out/

          if [ ! -f "dcm_source/my_dcm_project/out/plan_result.json" ]; then
            echo "ERROR: plan_result.json was not generated."
            exit 1
          fi

          echo "DCM PLAN completed successfully."

      # 8. Upload DCM PLAN results
      - name: Upload DCM Plan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DCM-DEV-Plan-Results
          path: |
            plan.txt
            dcm_source/my_dcm_project/out/
          if-no-files-found: warn
          retention-days: 30
