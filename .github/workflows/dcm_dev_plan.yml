# ===============================================================
# WORKFLOW: DCM Plan
# Purpose : Run a Snowflake DCM PLAN (a dry run that shows what WOULD
#           change; nothing is deployed). Runs automatically on pull
#           requests and can also be started manually from the
#           Actions tab.
# Location: .github/workflows/dcm_plan.yml (repo root)
# ===============================================================
name: DCM Plan

# ---------------------------------------------------------------
# TRIGGERS: when this workflow starts
# ---------------------------------------------------------------
on:
  # Automatic: a pull request into dev or main that changes any file
  # inside my_dcm_project/
  pull_request:
    branches: [dev, main]
    paths: ["my_dcm_project/**"]

  # Manual: adds the "Run workflow" button in the Actions tab.
  # The person starting it picks the branch ("Use workflow from")
  # and the target environment from the dropdown below.
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to plan against"
        required: true
        default: DEV
        type: choice
        options:          # must match target names in manifest.yml
          - DEV
          - QA

# ---------------------------------------------------------------
# PERMISSIONS for the temporary GitHub token used by this run
#   contents: read       -> allows checking out the repo files
#   id-token: write      -> allows OIDC login to Snowflake
#                           (no password or key stored in GitHub)
#   pull-requests: write -> allows posting the plan summary on a PR
# ---------------------------------------------------------------
permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  #
