# Manually-triggered workflow to manage a Snowflake DCM (Database Change Management) project
# Authenticates to Snowflake through Azure OIDC (no stored Snowflake passwords/keys)
name: DCM Plan

on:
  workflow_dispatch:
    inputs:
      sfEnvironment:
        type: choice
        description: Which level to deploy to
        options:
          - DEV
          - QA
          - UAT
          - PROD
      sfAction:
        type: choice
        description: Action on the DCM project
        options:
          - CREATE
          - PLAN
          - DROP
          - DEPLOY
      sourceDatabase:
        type: string
        description: Source database name (e.g. DEV_RAW_DB)
        required: true
        default: DEV_RAW_DB
      sourceSchema:
        type: string
        description: Source schema name (e.g. ALIP)
        required: true
        default: ALIP
      targetDatabase:
        type: string
        description: Target database name (e.g. QA_RAW_DB)
        required: true
      targetSchema:
        type: string
        description: Target schema name (e.g. ALIP)
        required: true
        default: ALIP

permissions:
  contents: read
  id-token: write

jobs:

  set-env:
    runs-on: ubuntu-latest
    outputs:
      ENVIRONMENT_NAME: ${{ steps.set-environment.outputs.env_name }}
    steps:
    - name: 'Set Environment Name'
      id: set-environment
      run: |
        echo "env_name=nonprod" >> "$GITHUB_OUTPUT"
        if [[ "${{ github.ref_name }}" == "main" ]]; then
          echo "env_name=prd" >> "$GITHUB_OUTPUT"
        fi

  dcm:
    runs-on: linux-self-hosted
    needs: [set-env]
    environment: ${{ needs.set-env.outputs.ENVIRONMENT_NAME }}

    # Pass inputs via env vars (safer than inlining ${{ inputs.* }} in shell scripts)
    env:
      SF_ENV: ${{ inputs.sfEnvironment }}
      SRC_DB: ${{ inputs.sourceDatabase }}
      SRC_SCHEMA: ${{ inputs.sourceSchema }}
      TGT_DB: ${{ inputs.targetDatabase }}
      TGT_SCHEMA: ${{ inputs.targetSchema }}

    steps:

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Free-text inputs: allow only valid unquoted Snowflake identifiers
      - name: Validate database and schema inputs
        run: |
          for v in SRC_DB SRC_SCHEMA TGT_DB TGT_SCHEMA; do
            val="${!v}"
            if [[ ! "$val" =~ ^[A-Za-z_][A-Za-z0-9_$]*$ ]]; then
              echo "::error::Invalid value for $v: '$val'"
              exit 1
            fi
          done
          # Uppercase for consistency with Snowflake's unquoted identifier behavior
          echo "SRC_DB=${SRC_DB^^}"         >> "$GITHUB_ENV"
          echo "SRC_SCHEMA=${SRC_SCHEMA^^}" >> "$GITHUB_ENV"
          echo "TGT_DB=${TGT_DB^^}"         >> "$GITHUB_ENV"
          echo "TGT_SCHEMA=${TGT_SCHEMA^^}" >> "$GITHUB_ENV"

      - name: Install Snow CLI
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install snowflake-cli
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: 'Azure Login via OIDC'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUB_ID }}

      - name: 'Get Azure OIDC Token'
        id: azure-token
        run: |
          TOKEN=$(az account get-access-token --scope "api://966f935f-5447-4821-a6df-50a85a0c4c60/.default" --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # Debug only: prints claims, not the token. Remove once stable.
      - name: Inspect OIDC Token
        env:
          TOKEN: ${{ steps.azure-token.outputs.token }}
        run: |
          echo "$TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq .

      - name: 'Run DCM Plan'
        id: dcm-plan
        if: ${{ inputs.sfAction == 'PLAN' }}
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
          SNOWFLAKE_AUTHENTICATOR: oauth
          SNOWFLAKE_TOKEN: ${{ steps.azure-token.outputs.token }}
        continue-on-error: true
        run: |
          snow dcm plan --target "$SF_ENV" --from ./DCM_DEPLOY_POC_DB \
            --variable "source_db=$SRC_DB" \
            --variable "source_schema=$SRC_SCHEMA" \
            --variable "target_db=$TGT_DB" \
            --variable "target_schema=$TGT_SCHEMA" \
            --save-output -x

      - name: 'Run DCM Create'
        id: dcm-create
        if: ${{ inputs.sfAction == 'CREATE' }}
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
          SNOWFLAKE_AUTHENTICATOR: oauth
          SNOWFLAKE_TOKEN: ${{ steps.azure-token.outputs.token }}
        continue-on-error: true
        run: |
          snow dcm create --target "$SF_ENV" --from ./DCM_DEPLOY_POC_DB --if-not-exists -x

      - name: 'Drop DCM'
        id: dcm-drop
        if: ${{ inputs.sfAction == 'DROP' }}
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
          SNOWFLAKE_AUTHENTICATOR: oauth
          SNOWFLAKE_TOKEN: ${{ steps.azure-token.outputs.token }}
        continue-on-error: true
        run: |
          snow dcm drop --target "$SF_ENV" --from ./DCM_DEPLOY_POC_DB -x

      - name: 'Run DCM Deploy'
        id: dcm-deploy
        if: ${{ inputs.sfAction == 'DEPLOY' }}
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
          SNOWFLAKE_AUTHENTICATOR: oauth
          SNOWFLAKE_TOKEN: ${{ steps.azure-token.outputs.token }}
        run: |
          snow dcm deploy --target "$SF_ENV" --from ./DCM_DEPLOY_POC_DB \
            --variable "source_db=$SRC_DB" \
            --variable "source_schema=$SRC_SCHEMA" \
            --variable "target_db=$TGT_DB" \
            --variable "target_schema=$TGT_SCHEMA" \
            -x

      # Upload plan output so it can be reviewed
      - name: Upload plan output
        if: ${{ inputs.sfAction == 'PLAN' }}
        uses: actions/upload-artifact@v4
        with:
          name: dcm-plan-${{ inputs.sfEnvironment }}
          path: out/
          if-no-files-found: warn
