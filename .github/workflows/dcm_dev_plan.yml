
name: DCM DEV Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Execute DCM PLAN - DEV
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: GITHUB_DCM_PLAN_USER
      SNOWFLAKE_ROLE: GITHUB_DCM_PLAN_ROLE

    steps:

      # 1. Checkout Main branch containing the workflow
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      # 2. Checkout DCM project from DEV branch
      - name: Checkout DCM DEV Project
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dcm_source
          persist-credentials: false

      # 3. Verify DCM project structure
      - name: Verify DCM Project Structure
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="dcm_source/my_dcm_project"

          echo "Checking DCM project directory..."
          echo "Current directory: $(pwd)"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: DCM project directory not found: $PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/manifest.yml" ]; then
            echo "ERROR: manifest.yml not found."
            exit 1
          fi

          echo "DCM project structure verified."
          echo "Project directory contents:"
          ls -la "$PROJECT_DIR"

      # 4. Install Snowflake CLI with OIDC authentication
      - name: Install Snowflake CLI with OIDC
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.24.0"

      # 5. Test Snowflake connection
      - name: Test Snowflake Connection
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing Snowflake OIDC connection..."
          snow connection test -x

          echo "Snowflake connection successful."

      # 6. Execute DCM PLAN for DEV
      - name: DCM Plan - DEV
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="dcm_source/my_dcm_project"

          echo "Executing DCM PLAN for DEV..."
          echo "DCM project: $PROJECT_DIR"
          echo "Target: DEV"

          snow dcm plan \
            --target DEV \
            --from "$PROJECT_DIR" \
            --save-output \
            -x

          echo "DCM PLAN command completed successfully."

      # 7. Verify and copy DCM PLAN output
      - name: Prepare Migrated Directory
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="dcm_source/my_dcm_project"
          SOURCE_DIR="$PROJECT_DIR/out"
          TARGET_DIR="$PROJECT_DIR/migrated"

          echo "Checking DCM PLAN output..."

          # Verify that Snowflake generated the output directory
          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: DCM PLAN output directory was not generated."
            echo "Expected location: $SOURCE_DIR"

            echo "Project directory contents:"
            find "$PROJECT_DIR" -maxdepth 3 -print

            exit 1
          fi

          # Verify that output contains actual files
          FILE_COUNT=$(find "$SOURCE_DIR" -type f | wc -l)

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: DCM PLAN output directory is empty."
            echo "Expected output under: $SOURCE_DIR"
            exit 1
          fi

          echo "Found $FILE_COUNT DCM PLAN output file(s)."

          # Recreate migrated directory
          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"

          # Copy all output files and subdirectories
          cp -a "$SOURCE_DIR/." "$TARGET_DIR/"

          echo "DCM PLAN output copied successfully."

          echo "Files in migrated directory:"
          find "$TARGET_DIR" -type f -print

          echo "Migrated directory size:"
          du -sh "$TARGET_DIR"

      # 8. Upload migrated directory as GitHub artifact
      - name: Upload DCM Plan Results
        uses: actions/upload-artifact@v4
        with:
          name: dcm-dev-plan-results
          path: dcm_source/my_dcm_project/migrated/
          if-no-files-found: error
          retention-days: 30
