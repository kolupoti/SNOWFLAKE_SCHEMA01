
name: DCM DEV Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Execute DCM PLAN - DEV
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: GITHUB_DCM_PLAN_USER
      SNOWFLAKE_ROLE: GITHUB_DCM_PLAN_ROLE

    steps:
      # Checkout the branch containing this workflow
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      # Checkout the DCM project from DEV
      - name: Checkout DCM DEV Project
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dcm_source
          persist-credentials: false

      # Install Snowflake CLI and configure OIDC
      - name: Install Snowflake CLI with OIDC
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.24.0"

      # Verify Snowflake connectivity
      - name: Test Snowflake Connection
        run: |
          snow connection test -x

      # Execute DCM PLAN
      - name: DCM Plan - DEV
        run: |
          snow dcm plan \
            --target DEV \
            --from dcm_source/my_dcm_project \
            --save-output \
            -x

      # Save PLAN output as a GitHub artifact
      - name: Upload DCM Plan Results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dcm-dev-plan-results
          path: dcm_source/my_dcm_project/out/
          if-no-files-found: error
