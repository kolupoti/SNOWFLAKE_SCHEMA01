# WORKFLOW: DCM Plan
# Purpose: on every pull request, run a Snowflake DCM PLAN (dry run) so
#          reviewers see what would change before anything is deployed.
name: DCM Plan

# TRIGGER: PRs into dev or main that change files in my_dcm_project/
on:
  pull_request:
    branches: [dev, main]
    paths: ["my_dcm_project/**"]

# PERMISSIONS for the temporary GitHub token
#   contents: read       -> check out the repo
#   id-token: write      -> issue an OIDC token to log in to Snowflake
#   pull-requests: write -> post the plan summary on the PR
permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # JOB 1: decide the environment from the branch the PR targets
  setup:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.map.outputs.target }}      # DEV or QA (manifest target)
      env_name: ${{ steps.map.outputs.env_name }}  # dev or qa (GitHub Environment)
    steps:
      # PR into main -> QA / qa ; PR into dev -> DEV / dev
      - id: map
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            echo "target=QA"  >> "$GITHUB_OUTPUT"
            echo "env_name=qa" >> "$GITHUB_OUTPUT"
          else
            echo "target=DEV" >> "$GITHUB_OUTPUT"
            echo "env_name=dev" >> "$GITHUB_OUTPUT"
          fi

  # JOB 2: run the plan against the chosen target
  plan:
    needs: setup
    runs-on: ubuntu-latest
    # The GitHub Environment supplies the SNOWFLAKE_USER variable and the
    # identity (subject) in the OIDC token that Snowflake checks.
    environment: ${{ needs.setup.outputs.env_name }}
    steps:
      # STEP 1: download the PR code (manifest.yml and definitions)
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # STEP 2: install the Snowflake CLI, log in with OIDC, run the plan.
      # Account, project object, owner role and templating config all come
      # from the matching target in manifest.yml.
      - uses: snowflakedb/snowflake-actions/dcm/plan@v3
        with:
          target: ${{ needs.setup.outputs.target }}
          project-path: my_dcm_project/
          snowflake-user: ${{ vars.SNOWFLAKE_USER }}
