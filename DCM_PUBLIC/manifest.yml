type: DCM_PROJECT

default_target: DEV

targets:

  DEV:
    account_identifier: ACCOUNTADMIN
    project_name: DCM_ADMIN_DB.DCM_PUBLIC.DCM_PUBLIC_DEV
    project_owner: DCM_PUBLIC_DEPLOYER
    templating_config: DEV

  QA:
    account_identifier: ACCOUNTADMIN
